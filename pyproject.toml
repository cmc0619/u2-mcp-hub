[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "u2-mcp"
version = "0.9.0"
description = "MCP server for Rocket Universe/UniData MultiValue databases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "cmc0619" }
]
keywords = ["mcp", "universe", "unidata", "multivalue", "pick", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "mcp>=1.24.0,<2",
    "uopy>=1.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.25.0",
    "starlette>=0.27.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
    "jinja2>=3.1.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest-playwright>=0.5.0",
    # Pinned to the Playwright image CI runs the browser tests in (.github/workflows/ci.yml).
    "playwright==1.64.1",
]

[project.scripts]
u2-mcp = "u2_mcp.server:main"

[project.urls]
Homepage = "https://github.com/cmc0619/u2-mcp-hub"
Documentation = "https://github.com/cmc0619/u2-mcp-hub#readme"
Repository = "https://github.com/cmc0619/u2-mcp-hub"
Issues = "https://github.com/cmc0619/u2-mcp-hub/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/u2_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Design specs and plans quote code for people to read, not to lint or format.
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
# Relax checks for third-party libraries without type stubs
ignore_missing_imports = true
# FastMCP decorators and pydantic validators don't have full type annotations.
# call-arg is disabled because pydantic-settings loads values from env vars at
# runtime. Nothing else is suppressed: `mypy src/` is clean, and CI enforces it.
disable_error_code = ["misc", "untyped-decorator", "call-arg"]
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: browser tests against a running server (run with: pytest -m e2e tests/e2e)",
]
addopts = "-m \"not e2e\" -n auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette's TestClient prefers httpx2; the phase 2a dependency list is fixed.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
    # pytest-base-url (pulled in by pytest-playwright) defines its base_url fixture
    # in a way pytest 9.2 deprecates; nothing in this repo can change that.
    "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]
