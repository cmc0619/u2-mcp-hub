name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Security assurance has to be continuous: a one-off audit only describes the
  # day it was run. This job fails the build on a high-severity code finding or a
  # known vulnerability in a dependency.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the application and security tools
        run: pip install . bandit pip-audit

      - name: Scan source for insecure patterns
        run: bandit -r src/ --severity-level medium --confidence-level medium

      - name: Check dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install -e . ruff==0.16.5 mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # Parallel across the runner's cores (pyproject addopts: -n auto).
        run: pytest --cov=u2_mcp --cov-report=xml

      - name: Check the admin site ships in the wheel
        if: matrix.python-version == '3.12'
        run: |
          pip wheel . --no-deps -w dist -q
          python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/u2_mcp-*.whl')[0]).namelist(); need=['u2_mcp/admin/templates/base.html','u2_mcp/admin/static/htmx.min.js']; missing=[x for x in need if x not in n]; sys.exit(f'missing from wheel: {missing}' if missing else 0)"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The image people deploy: built, started with compose, proven healthy, shown to
  # hold no test code, and run behind both proxy examples. Then the whole browser
  # suite (setup wizard and admin pages, driven by Chromium with a scripted U2
  # driver) runs against the image's test target, one container per test. This is
  # the only browser run: the image is what ships. A missing browser is an error.
  docker:
    runs-on: ubuntu-latest
    env:
      U2_SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v5

      - name: Build the release and test images
        run: |
          docker build --target release -t u2-mcp:ci .
          docker build --target test -t u2-mcp:ci-test .

      # find_spec('tests.mocks') raises when there is no `tests` package at all,
      # so ask for the parent first.
      - name: The release image holds no test code
        run: >
          docker run --rm --entrypoint python u2-mcp:ci -c
          "import importlib.util as u, sys; sys.exit(u.find_spec('tests') is not None
          and u.find_spec('tests.mocks') is not None)"

      - name: docker compose starts a healthy server
        env:
          U2_IMAGE: u2-mcp:ci
        run: |
          docker compose up -d --wait --wait-timeout 120 || { docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8000/health
          docker compose exec -T u2-mcp u2-mcp admin show-setup-code
          docker compose down -v

      - name: The Caddy and nginx examples serve the admin site
        env:
          U2_IMAGE: u2-mcp:ci
          U2_SITE_ADDRESS: ":80"
          # Plain http on port 80 here, so the public URL is http too (nginx requires it).
          U2_PUBLIC_URL: http://127.0.0.1
        run: |
          for proxy in caddy nginx; do
            compose="docker compose -f deploy/$proxy/docker-compose.yml"
            $compose up -d --wait --wait-timeout 120 || { $compose logs; exit 1; }
            # The proxy may still be binding its port when compose says it runs.
            curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1/health
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/admin/sign-in)" = "303"
            $compose down -v
          done

      # Playwright's own image has Chromium and its system packages already, which
      # took about 170 s to install on the runner. It shares the host's network and
      # Docker, so the fixture's `docker run --network host` works from inside it.
      # PLAYWRIGHT_VERSION must match the playwright pin in pyproject.toml.
      - name: Browser tests against the image
        env:
          PLAYWRIGHT_VERSION: "1.64.1"
        run: >
          docker run --rm --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD":/w -w /w -v /tmp:/tmp
          -e U2_E2E_IMAGE=u2-mcp:ci-test
          mcr.microsoft.com/playwright/python:v${PLAYWRIGHT_VERSION}-noble
          bash -ec 'python3 -c "import urllib.request as u; u.urlretrieve(\"https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz\", \"/tmp/d.tgz\")";
          tar xzf /tmp/d.tgz -C /usr/local/bin --strip-components=1 docker/docker;
          pip install -q --break-system-packages -e ".[dev]";
          pytest -m e2e tests/e2e --browser chromium -n 0'

      - name: Keep server logs when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-server-logs
          path: /tmp/pytest-of-*/**/*.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: [security, lint, test, docker]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
